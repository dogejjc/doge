name: Arena tracker

on:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "0,30 * * * *"
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      operation:
        description: "要执行的操作"
        required: true
        type: choice
        options:
          - 立即读取官方榜单
          - 手动补录未上榜分数
          - 更正同名账号
          - 排除同名候选
          - 登记主播新ID
          - 合并恢复完整JSON备份
          - 合并导入历史CSV
      player:
        description: "主播（自动读取/恢复数据时可忽略）"
        required: false
        type: choice
        options:
          - 一本正经的稻哥
          - 最后一只脏牧
          - 我爱李大燕丶
          - 人五人六
      score:
        description: "补录时填分数；更正时填正确分数；排除时填错误候选分数"
        required: false
        type: string
      rank:
        description: "更正或排除同名时填写对应名次（候选同分时必填）"
        required: false
        type: string
      recorded_at:
        description: "记录时间，如 2026-09-06 15:30；留空为现在"
        required: false
        type: string
      season:
        description: "赛季编号；留空为当前赛季"
        required: false
        type: string
      new_alias:
        description: "主播新的完整游戏ID"
        required: false
        type: string
      note:
        description: "补录备注（可留空）"
        required: false
        type: string
      import_file:
        description: "恢复文件路径，例如 import/arena-backup.json 或 import/S9.csv"
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: doge-data-writes
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issues' && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[同名处理]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize data files if missing
        run: python admin.py init

      - name: Apply duplicate choice from website
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python admin.py duplicate-issue --body "$ISSUE_BODY"

      - name: Read official leaderboard
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == '立即读取官方榜单')
        run: python tracker.py

      - name: Add manual score
        if: github.event_name == 'workflow_dispatch' && inputs.operation == '手动补录未上榜分数'
        env:
          PLAYER: ${{ inputs.player }}
          SCORE: ${{ inputs.score }}
          RECORDED_AT: ${{ inputs.recorded_at }}
          SEASON: ${{ inputs.season }}
          NOTE: ${{ inputs.note }}
        run: python admin.py score --player "$PLAYER" --score "$SCORE" --time "$RECORDED_AT" --season "$SEASON" --note "$NOTE"

      - name: Register new player ID
        if: github.event_name == 'workflow_dispatch' && inputs.operation == '登记主播新ID'
        env:
          PLAYER: ${{ inputs.player }}
          NEW_ALIAS: ${{ inputs.new_alias }}
        run: python admin.py alias --player "$PLAYER" --alias "$NEW_ALIAS"

      - name: Resolve duplicate player name
        if: github.event_name == 'workflow_dispatch' && inputs.operation == '更正同名账号'
        env:
          PLAYER: ${{ inputs.player }}
          SCORE: ${{ inputs.score }}
          RANK: ${{ inputs.rank }}
          RECORDED_AT: ${{ inputs.recorded_at }}
          SEASON: ${{ inputs.season }}
        run: python admin.py resolve-duplicate --player "$PLAYER" --score "$SCORE" --rank "$RANK" --time "$RECORDED_AT" --season "$SEASON"

      - name: Exclude duplicate player candidate
        if: github.event_name == 'workflow_dispatch' && inputs.operation == '排除同名候选'
        env:
          PLAYER: ${{ inputs.player }}
          SCORE: ${{ inputs.score }}
          RANK: ${{ inputs.rank }}
          RECORDED_AT: ${{ inputs.recorded_at }}
          SEASON: ${{ inputs.season }}
        run: python admin.py exclude-duplicate --player "$PLAYER" --score "$SCORE" --rank "$RANK" --time "$RECORDED_AT" --season "$SEASON"

      - name: Restore JSON backup by merge
        if: github.event_name == 'workflow_dispatch' && inputs.operation == '合并恢复完整JSON备份'
        env:
          IMPORT_FILE: ${{ inputs.import_file }}
        run: python admin.py restore-json --file "$IMPORT_FILE"

      - name: Import CSV history by merge
        if: github.event_name == 'workflow_dispatch' && inputs.operation == '合并导入历史CSV'
        env:
          IMPORT_FILE: ${{ inputs.import_file }}
        run: python admin.py import-csv --file "$IMPORT_FILE"

      - name: Save data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json players.json
          if git diff --cached --quiet; then
            echo "No data file change"
          else
            git commit -m "Update arena data"
            git push
          fi

      - name: Close processed duplicate issue
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --comment "同名记录已处理，网页会在本次发布完成后显示结果。"

      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html players.json live.json _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
