  <style>

    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button{font:inherit}main{max-width:1540px;margin:auto;padding:30px 28px 58px}
    header{background:linear-gradient(135deg,#19233d 0%,#263760 54%,#3152a7 100%);color:#fff;border-radius:24px;padding:28px 32px 22px;box-shadow:var(--shadow)}h1{font-size:clamp(25px,3vw,38px);margin:0}

const $=s=>document.querySelector(s),fmt=n=>Number(n).toLocaleString('zh-CN'),time=s=>new Date(s).getTime(),dateLabel=t=>new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric'}).format(new Date(t));
function svgEl(tag,attrs={},text=''){const node=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text)node.textContent=text;return node}
function pathFrom(points,x,y){return points.map((p,i)=>(i?'L':'M')+x(p.t).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')}
function sourceURL(file){return file}
async function getJSON(file){const response=await fetch(sourceURL(file)+'?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error(`${file}读取失败`);return response.json()}

document.querySelectorAll('.tab').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===button.dataset.view))}));

function playerEvents(playerId,season,live){
 const events=[];
 live.snapshots.filter(s=>s.season===season).forEach(s=>{const p=s.players[playerId]||{};events.push({t:time(s.captured_at),v:p.found?Number(p.score):null,rank:p.rank,found:!!p.found,cut:s.cutoff500,source:'official',at:s.captured_at})});
 live.manual_records.filter(r=>r.season===season&&r.player_id===playerId).forEach(r=>events.push({t:time(r.captured_at),v:Number(r.score),rank:null,found:false,cut:r.cutoff500,source:'manual',at:r.captured_at}));
 return events.sort((a,b)=>a.t-b.t);
}
function latestSnapshot(live,season){return [...live.snapshots].reverse().find(x=>x.season===season)}
function chartDomain(allPoints,mode){
 const nums=allPoints.flat().map(p=>p.v).filter(Number.isFinite);
 if(mode==='rank')return[500,1];
 if(mode==='gap'){const lo=Math.min(-200,...nums),hi=Math.max(200,...nums),pad=Math.max(100,(hi-lo)*.12);return[Math.floor((lo-pad)/100)*100,Math.ceil((hi+pad)/100)*100]}
 const lo=Math.min(3000,...nums),hi=Math.max(6500,...nums),pad=Math.max(250,(hi-lo)*.1);return[Math.max(0,Math.floor((lo-pad)/500)*500),Math.ceil((hi+pad)/500)*500];
}
function lineChart(series,{mode='score',cutoffs=[],title='',subtitle='' }={}){
 const wrap=document.createElement('article');wrap.className='chart-card';wrap.innerHTML=`<h3>${title}</h3><div class="chart-sub">${subtitle}</div>`;
 const numeric=series.flatMap(s=>s.points.filter(p=>Number.isFinite(p.v)));if(!numeric.length){const e=document.createElement('div');e.className='empty';e.textContent='尚无分数记录';wrap.append(e);return wrap}
 const W=720,H=285,L=48,R=18,T=22,B=38,allTimes=numeric.map(p=>p.t).concat(cutoffs.map(p=>p.t)),rawMin=Math.min(...allTimes),rawMax=Math.max(...allTimes),x0=rawMin,x1=Math.max(rawMax,x0+DAY),x=t=>L+(t-x0)/(x1-x0)*(W-L-R);
 const [d0,d1]=chartDomain(series.map(s=>s.points),mode),y=v=>mode==='rank'?T+(v-d1)/(d0-d1)*(H-T-B):T+(d1-v)/(d1-d0)*(H-T-B);
 const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`});
 for(let i=0;i<=4;i++){const value=mode==='rank'?d1+(d0-d1)*i/4:d0+(d1-d0)*i/4,py=y(value);svg.append(svgEl('line',{x1:L,x2:W-R,y1:py,y2:py,stroke:'#e2e6ef'}));svg.append(svgEl('text',{x:L-7,y:py+4,'text-anchor':'end',class:'axis'},String(Math.round(value))))}
 [[x0,dateLabel(x0)],[(x0+x1)/2,dateLabel((x0+x1)/2)],[x1,dateLabel(x1)]].forEach(([t,label],i)=>svg.append(svgEl('text',{x:x(t),y:H-9,'text-anchor':i===0?'start':i===2?'end':'middle',class:'axis'},label)));
 if(mode==='score'&&cutoffs.length){svg.append(svgEl('path',{d:pathFrom(cutoffs,x,y),fill:'none',stroke:'#ed684f','stroke-width':2,'stroke-dasharray':'7 6'}))}
 if(mode==='gap'&&d0<0&&d1>0){svg.append(svgEl('line',{x1:L,x2:W-R,y1:y(0),y2:y(0),stroke:'#ed684f','stroke-width':2,'stroke-dasharray':'7 6'}))}
 series.forEach(s=>{const pts=s.points.filter(p=>Number.isFinite(p.v));if(pts.length>1)svg.append(svgEl('path',{d:pathFrom(pts,x,y),fill:'none',stroke:s.color,'stroke-width':3.2,'stroke-linecap':'round','stroke-linejoin':'round'}));pts.forEach(p=>{const px=x(p.t),py=y(p.v);if(p.source==='manual'){const q=`${px},${py-6} ${px+6},${py} ${px},${py+6} ${px-6},${py}`;const mark=svgEl('polygon',{points:q,fill:s.color,stroke:'#fff','stroke-width':2});mark.append(svgEl('title',{},`${s.name} · ${fmt(p.v)} · 手动补录`));svg.append(mark)}else{const mark=svgEl('circle',{cx:px,cy:py,r:5,fill:s.color,stroke:'#fff','stroke-width':2});mark.append(svgEl('title',{},`${s.name} · ${mode==='rank'?'第':''}${fmt(p.v)}${mode==='score'?'分':''}`));svg.append(mark)}})});
 wrap.append(svg);return wrap;
}
function renderLive(config,live){

 const grid=$('#statusGrid');grid.replaceChildren();
 config.players.forEach(player=>{const state=snapshot?.players?.[player.id]||{found:false},events=playerEvents(player.id,season,live),manual=[...events].reverse().find(e=>e.source==='manual'),score=state.found?state.score:manual?.v??null,cut=snapshot?.cutoff500??manual?.cut??null,gap=score!=null&&cut!=null?score-cut:null;const card=document.createElement('article');card.className='player-card';card.style.setProperty('--player',player.color);card.innerHTML=`<div class="player-name">${player.name}</div><div class="score">${score==null?'—':fmt(score)}</div><div class="meta-row"><span class="state ${state.found?'on':'off'}">${state.found?`第${state.rank}名`:'未在榜'}</span><span class="gap ${gap>=0?'up':'down'}">${gap==null?'暂无分数':`${gap>=0?'+':''}${fmt(gap)} 门槛`}</span></div>`;grid.append(card)});
 const personal=$('#personalCharts');personal.replaceChildren();const cutoffPoints=(live.snapshots||[]).filter(s=>s.season===season&&Number.isFinite(s.cutoff500)).map(s=>({t:time(s.captured_at),v:Number(s.cutoff500)}));
 config.players.forEach(player=>{const events=playerEvents(player.id,season,live).filter(e=>Number.isFinite(e.v));personal.append(lineChart([{name:player.name,color:player.color,points:events}],{title:player.name,subtitle:'分数走势',cutoffs:cutoffPoints}))});
 const checks=$('#playerChecks');checks.replaceChildren();config.players.forEach(player=>{const label=document.createElement('label');label.innerHTML=`<input type="checkbox" data-player="${player.id}" checked><span style="color:${player.color};font-weight:800">${player.name}</span>`;checks.append(label)});
 const drawCompare=()=>{const selected=[...checks.querySelectorAll('input:checked')].map(x=>x.dataset.player),players=config.players.filter(p=>selected.includes(p.id)),scoreSeries=players.map(p=>({name:p.name,color:p.color,points:playerEvents(p.id,season,live).filter(e=>Number.isFinite(e.v))})),gapSeries=players.map(p=>({name:p.name,color:p.color,points:playerEvents(p.id,season,live).filter(e=>Number.isFinite(e.v)&&Number.isFinite(e.cut)).map(e=>({...e,v:e.v-e.cut}))})),rankSeries=players.map(p=>({name:p.name,color:p.color,points:playerEvents(p.id,season,live).filter(e=>e.source==='official'&&e.found&&Number.isFinite(e.rank)).map(e=>({...e,v:e.rank}))}));const out=$('#compareCharts');out.replaceChildren();out.append(lineChart(scoreSeries,{title:'四主播分数对比',subtitle:'红色虚线为同期第500名门槛',cutoffs:cutoffPoints}));out.append(lineChart(gapSeries,{mode:'gap',title:'距离第500名',subtitle:'0以上为高于门槛，0以下为低于门槛'}));const rank=lineChart(rankSeries,{mode:'rank',title:'上榜排名变化',subtitle:'数值越小，排名越靠前'});rank.classList.add('wide');out.append(rank)};checks.querySelectorAll('input').forEach(x=>x.addEventListener('change',drawCompare));drawCompare();
}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967295}
function historySeries(s){const anchors=[[time(s.start+'T00:00:00Z'),s.startV],...(s.guides||[]).map(p=>[time(p[0]+'T00:00:00Z'),p[1]]),...s.points.map(p=>[time(p[0]+'T00:00:00Z'),p[1]]),[time(s.end+'T00:00:00Z'),s.endV]].sort((a,b)=>a[0]-b[0]).filter((p,i,a)=>!i||p[0]!==a[i-1][0]),out=[];for(let i=0;i<anchors.length-1;i++){const[a,av]=anchors[i],[b,bv]=anchors[i+1],days=Math.max(1,Math.round((b-a)/DAY)),seed=hash(s.id+i),cycles=days>16?2:days>7?1.35:.65;for(let d=0;d<=days;d++){if(i&&d===0)continue;const t=d/days,e=t*t*(3-2*t),base=av+(bv-av)*e,envelope=Math.sin(Math.PI*t),wave=Math.sin(2*Math.PI*cycles*t+seed*4-2)*.72+Math.sin(4*Math.PI*cycles*t+seed*7)*.28;out.push({t:a+d*DAY,v:Math.max(s.floor,Math.min(s.ceil,base+envelope*wave*s.vol))})}}return out}
function renderHistory(){const grid=$('#historyGrid');HISTORY.forEach(s=>{const card=document.createElement('article');card.className='season';card.innerHTML=`<div class="season-head"><div><h3>${s.id}</h3><div class="range">${s.start} — ${s.end}</div></div><span class="badge ${s.final==='in'?'up':'down'}">${s.final==='in'?`封榜上榜 · 第${s.rank}名`:'封榜未上榜'}</span></div>`;const W=520,H=300,L=47,R=15,T=26,B=43,x0=time(s.start+'T00:00:00Z'),x1=time(s.end+'T00:00:00Z'),x=t=>L+(t-x0)/(x1-x0)*(W-L-R),y=v=>T+(8600-v)/(8600-2800)*(H-T-B),svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`});for(const v of [3000,4000,5000,6000,7000,8000]){svg.append(svgEl('line',{x1:L,x2:W-R,y1:y(v),y2:y(v),stroke:'#e2e6ef'}));svg.append(svgEl('text',{x:L-7,y:y(v)+4,'text-anchor':'end',class:'axis'},v))}svg.append(svgEl('line',{x1:L,x2:W-R,y1:y(s.cut),y2:y(s.cut),stroke:'#ed684f','stroke-width':2,'stroke-dasharray':'7 6'}));svg.append(svgEl('text',{x:W-R-2,y:y(s.cut)-6,'text-anchor':'end',class:'cut-label'},`封榜线 ${fmt(s.cut)}`));const curve=historySeries(s);svg.append(svgEl('path',{d:pathFrom(curve,x,y),fill:'none',stroke:'#3568e8','stroke-width':3.2,'stroke-linecap':'round','stroke-linejoin':'round'}));[['赛季初期',x0],['赛季中段',(x0+x1)/2],['赛季结束',x1]].forEach(([label,t],i)=>svg.append(svgEl('text',{x:x(t),y:H-9,'text-anchor':i===0?'start':i===2?'end':'middle',class:'axis'},label)));s.points.forEach(p=>{const px=x(time(p[0]+'T00:00:00Z')),py=y(p[1]),approx=p[2]==='approx',col=p[1]>=s.cut?'#13845b':'#cf4a4a';if(approx){svg.append(svgEl('polygon',{points:`${px},${py-7} ${px+7},${py} ${px},${py+7} ${px-7},${py}`,fill:'#e5a625',stroke:'#fff','stroke-width':2}));svg.append(svgEl('text',{x:px+9,y:py-10,class:'value',fill:'#9a6800'},'≈8,200+'))}else{svg.append(svgEl('circle',{cx:px,cy:py,r:5.5,fill:col,stroke:'#fff','stroke-width':2.5}));svg.append(svgEl('text',{x:px,y:py-10,'text-anchor':'middle',class:'value'},fmt(p[1])))}});card.append(svg);const trend=document.createElement('div');trend.className='trend';trend.innerHTML=`<b>趋势：</b>${s.trend}`;card.append(trend);grid.append(card)})}
async function load(){try{const[config,live]=await Promise.all([getJSON('players.json'),getJSON('live.json')]);$('#loadError').classList.add('hidden');renderLive(config,live)}catch(error){if(location.protocol==='file:'){renderLive(DEFAULT_CONFIG,DEFAULT_LIVE);$('#loadError').classList.add('hidden');return}$('#loadError').textContent='实时数据暂时无法读取：'+error.message;$('#loadError').classList.remove('hidden')}}
renderHistory();load();setInterval(load,300000);
</script>
