function playerEvents(playerId,season,live){
 const events=[];
 (live.snapshots||[]).filter(s=>Number(s.season)===season).forEach(s=>{const p=s.players?.[playerId]||{};events.push({t:time(s.captured_at),v:p.found?Number(p.score):null,rank:p.rank,found:!!p.found,cut:s.cutoff500,source:'official',at:s.captured_at})});
 (live.manual_records||[]).filter(r=>Number(r.season)===season&&r.player_id===playerId).forEach(r=>events.push({t:time(r.captured_at),v:Number(r.score),rank:null,found:false,cut:r.cutoff500,source:'manual',at:r.captured_at}));

function collapseFlat(points){
 // 连续相同值只保留该段首尾；真正变化点、缺失点、手动补录全部保留。
 const pts=[...points].sort((a,b)=>a.t-b.t),out=[];let run=[];
 const flush=()=>{if(!run.length)return;if(run.length===1)out.push(run[0]);else out.push(run[0],run[run.length-1]);run=[]};
 pts.forEach(p=>{
  if(!Number.isFinite(p.v)||p.source==='manual'){flush();out.push(p);return}
  if(!run.length||run[run.length-1].v===p.v)run.push(p);else{flush();run=[p]}
 });
 flush();return out;
}
function lineSegments(points){
 const out=[];let segment=[];
 const flush=()=>{if(segment.length)out.push(segment);segment=[]};
 [...points].sort((a,b)=>a.t-b.t).forEach(p=>{if(!Number.isFinite(p.v)){flush();return}if(p.source==='manual'){flush();return}segment.push(p)});flush();return out;
}

function availableSeasons(live){return [...new Set([Number(live.current_season),...(live.snapshots||[]).map(s=>Number(s.season)),...(live.manual_records||[]).map(r=>Number(r.season))].filter(Number.isFinite))].sort((a,b)=>a-b)}
function csvCell(value){const text=value==null?'':String(value);return/[",\n]/.test(text)?`"${text.replaceAll('"','""')}"`:text}
function downloadBlob(name,blob){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportSeasonCSV(config,live,season){
 const names=Object.fromEntries(config.players.map(p=>[p.id,p.name])),rows=[];
 (live.snapshots||[]).filter(s=>Number(s.season)===season).forEach(s=>config.players.forEach(p=>{const state=s.players?.[p.id]||{},score=state.found?state.score:null,cut=s.cutoff500;rows.push([s.captured_at,`S${season}`,p.id,p.name,'官方榜单',state.found?'上榜':'未上榜',score,state.rank,cut,Number.isFinite(score)&&Number.isFinite(cut)?score-cut:'',s.first_place_score??'',s.first_place_name??'',s.leaderboard_total??''])}));
 (live.manual_records||[]).filter(r=>Number(r.season)===season).forEach(r=>rows.push([r.captured_at,`S${season}`,r.player_id,names[r.player_id]||r.player_id,'手动补录','未上榜',r.score,'',r.cutoff500,Number.isFinite(r.score)&&Number.isFinite(r.cutoff500)?r.score-r.cutoff500:'','','','']));
 rows.sort((a,b)=>time(a[0])-time(b[0])||String(a[3]).localeCompare(String(b[3])));const data=[['记录时间','赛季','主播ID','主播','来源','榜单状态','分数','排名','前500进榜线','高出进榜线','第一名分数','第一名ID','榜单人数'],...rows].map(row=>row.map(csvCell).join(',')).join('\n'),last=latestSnapshot(live,season)?.captured_at?.slice(0,10)||new Date().toISOString().slice(0,10);downloadBlob(`地下竞技场-S${season}-截至${last}.csv`,new Blob(['\ufeff'+data],{type:'text/csv;charset=utf-8'}));
}
function exportFullBackup(config,live){const payload={format:'doge-arena-backup-v1',exported_at:new Date().toISOString(),players:config,live},stamp=new Date().toISOString().replace(/[:.]/g,'-');downloadBlob(`地下竞技场-完整备份-${stamp}.json`,new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}))}
function renderApp(){
 const {config,live,season}=APP,select=$('#seasonSelect'),seasons=availableSeasons(live);select.replaceChildren(...seasons.map(n=>{const option=document.createElement('option');option.value=n;option.textContent=`S${n}${n===Number(live.current_season)?'（当前）':''}`;return option}));select.value=String(season);select.onchange=()=>{APP.season=Number(select.value);renderApp()};$('#exportCsv').onclick=()=>exportSeasonCSV(config,live,APP.season);$('#exportBackup').onclick=()=>exportFullBackup(config,live);renderLive(config,live,season);
}
function applyData(config,live){const current=Number(live.current_season);if(APP.season===null||APP.lastCurrent===null||current>APP.lastCurrent)APP.season=current;APP.config=config;APP.live=live;APP.lastCurrent=current;renderApp()}
async function load(){try{const[config,live]=await Promise.all([getJSON('players.json'),getJSON('live.json')]);$('#loadError').classList.add('hidden');applyData(config,live)}catch(error){if(location.protocol==='file:'){applyData(DEFAULT_CONFIG,DEFAULT_LIVE);$('#loadError').classList.add('hidden');return}$('#loadError').textContent='实时数据暂时无法读取：'+error.message;$('#loadError').classList.remove('hidden')}}
renderHistory();load();setInterval(load,60000);setInterval(()=>{if(!APP.live||APP.season!==Number(APP.live.current_season))return;const snapshot=latestSnapshot(APP.live,APP.season),checked=APP.live.last_checked_at||snapshot?.captured_at,changed=APP.live.last_data_change_at||snapshot?.captured_at,next=nextPlannedCheck();$('#updated').innerHTML=`<div class="update-line"><strong>最后检查</strong> ${formatDateTime(checked)}</div><div class="update-line"><strong>最后变化</strong> ${formatDateTime(changed)}</div><div class="update-line"><strong>下次计划</strong> ${formatDateTime(next.toISOString())}</div>`},30000);
</script>
